services:
  api:
    build:
      context: .
    command: uv run python -m api --host 0.0.0.0 --port 8000 --strict-port
    env_file:
      - path: .env
        required: false
    ports:
      # Change the host side with API_PORT=8001 when 8000 is taken on your machine.
      - "${API_PORT:-8000}:8000"
    volumes:
      - incident_data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: .
    command: uv run python -m worker
    env_file:
      - path: .env
        required: false
    volumes:
      - incident_data:/app/data
    restart: unless-stopped
    depends_on:
      - api

volumes:
  incident_data:

