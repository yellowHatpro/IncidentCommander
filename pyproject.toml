[project]
name = "incident-commander"
version = "0.2.0"
description = "Hackathon MVP for AI-powered incident analysis on DigitalOcean Gradient."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.135.1",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

